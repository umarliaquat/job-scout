name: Refresh public job research
run-name: Job refresh - ${{ github.event_name == 'schedule' && 'GitHub schedule' || inputs.trigger_source || 'manual' }}
on:
  workflow_dispatch:
    inputs:
      trigger_source:
        description: "Scheduler source (for verification)"
        type: string
        default: manual
      force_collection:
        description: "Run a repair collection even if today already succeeded"
        type: boolean
        default: false
  schedule:
    # 07:23 PKT primary; 09:23 and 10:23 PKT recovery attempts.
    - cron: '23 2 * * *'
    - cron: '23 4 * * *'
    - cron: '23 5 * * *'
permissions:
  contents: write
  pages: write
concurrency:
  group: refresh-public-jobs
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check collector, browser and refresh guards
        run: |
          python3 -B -m unittest discover -s tests -q
          node tests/public_runtime.cjs
          node tests/reading_runtime.cjs
      - name: Skip collection if already successful today in Pakistan
        id: plan
        env:
          FORCE_COLLECTION: ${{ inputs.force_collection }}
        run: python3 -B refresh_control.py plan
      - name: Restore daily public API request counter
        if: steps.plan.outputs.collect == 'true'
        run: python3 -B refresh_control.py restore
      - name: Collect free public sources
        if: steps.plan.outputs.collect == 'true'
        run: python3 -B scout.py scan
      - name: Validate and build sanitized snapshot
        if: steps.plan.outputs.collect == 'true'
        run: |
          python3 -B refresh_control.py validate
          python3 -B publish.py --output docs
      - name: Persist request counter even after collection failure
        if: always() && steps.plan.outputs.collect == 'true'
        run: python3 -B refresh_control.py persist
      - name: Commit successful snapshot and public request counter
        if: always() && steps.plan.outputs.collect == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          if [ -d .refresh-state ]; then git add .refresh-state; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public job research and API usage counter'
            git push
          fi
      - name: Check published collection freshness
        id: publication
        run: python3 -B refresh_control.py publication
      - name: Rebuild Pages (also recovers a failed earlier deployment)
        if: steps.publication.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            if gh api --method POST repos/${{ github.repository }}/pages/builds; then exit 0; fi
            sleep 15
          done
          exit 1
      - name: Record scheduler provenance
        if: always()
        env:
          RUN_EVENT: ${{ github.event_name }}
          RUN_SCHEDULE: ${{ github.event.schedule }}
          TRIGGER_SOURCE: ${{ inputs.trigger_source }}
          COLLECT_NEEDED: ${{ steps.plan.outputs.collect }}
        run: |
          echo "Event: $RUN_EVENT" >> "$GITHUB_STEP_SUMMARY"
          echo "Schedule: $RUN_SCHEDULE" >> "$GITHUB_STEP_SUMMARY"
          echo "External source: $TRIGGER_SOURCE" >> "$GITHUB_STEP_SUMMARY"
          echo "Collection needed: $COLLECT_NEEDED" >> "$GITHUB_STEP_SUMMARY"
